version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Ignore unchecked errors on writes to stderr/stdout and on Close in
      # defers — these are conventional and not worth handling.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*github.com/gorilla/websocket.Conn).Close
  exclusions:
    rules:
      # Test HTTP handlers and pipes routinely ignore Write/Encode/Close errors.
      - path: _test\.go
        linters:
          - errcheck
